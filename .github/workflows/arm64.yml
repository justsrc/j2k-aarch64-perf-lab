name: arm64-j2k

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      timing:
        description: "Run coarse timing (non-authoritative; use a local machine for numbers)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: linux-${{ matrix.tag }}-${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            tag: ubuntu24.04
            cc: gcc
          - runner: ubuntu-26.04-arm
            tag: ubuntu26.04
            cc: gcc
          - runner: ubuntu-26.04-arm
            tag: ubuntu26.04
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang

      - name: Build stock, NEON, minimal and fused
        env:
          CC: ${{ matrix.cc }}
        run: ./scripts/build.sh

      - name: Checkasm and bit-exactness
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p results
          ./scripts/verify.sh | tee results/verify-linux-${{ matrix.tag }}-${{ matrix.cc }}.txt

      - name: Checkasm kernel timing (indicative only)
        shell: bash
        run: |
          work/neon/tests/checkasm/checkasm --test=jpeg2000dsp --bench \
            2>&1 | tee results/checkasm-bench-linux-${{ matrix.tag }}-${{ matrix.cc }}.txt

      - name: Coarse timing (optional, non-authoritative)
        if: github.event_name == 'workflow_dispatch' && inputs.timing
        shell: bash
        run: |
          THREADS=1 ROUNDS=3 ./scripts/bench.sh \
            | tee results/bench-linux-${{ matrix.tag }}-${{ matrix.cc }}-1t.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.tag }}-${{ matrix.cc }}
          path: results/

  macos-arm64:
    name: macos-${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is the current GA arm64 image (Xcode 26.x).
          - runner: macos-26
            tag: macos26-xcode26
          # xcode-27 is a public preview image: macOS 26 with Xcode 27.
          - runner: xcode-27
            tag: macos26-xcode27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build stock, NEON, minimal and fused
        env:
          CC: clang
        run: ./scripts/build.sh

      - name: Checkasm and bit-exactness
        shell: bash
        env:
          CC: clang
        run: |
          mkdir -p results
          ./scripts/verify.sh | tee results/verify-macos-${{ matrix.tag }}.txt

      - name: Checkasm kernel timing (indicative only)
        shell: bash
        run: |
          work/neon/tests/checkasm/checkasm --test=jpeg2000dsp --bench \
            2>&1 | tee results/checkasm-bench-macos-${{ matrix.tag }}.txt

      - name: Coarse timing (optional, non-authoritative)
        if: github.event_name == 'workflow_dispatch' && inputs.timing
        shell: bash
        run: |
          THREADS=1 ROUNDS=3 ./scripts/bench.sh \
            | tee results/bench-macos-${{ matrix.tag }}-1t.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.tag }}
          path: results/
