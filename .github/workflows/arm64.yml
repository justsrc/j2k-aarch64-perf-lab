name: arm64-j2k

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Build stock and NEON
        run: ./scripts/build.sh

      - name: Checkasm
        run: |
          mkdir -p results
          RUNS=5 ./scripts/checkasm.sh | tee results/checkasm-linux-arm64.txt

      - name: Decode benchmark, 1 thread
        run: THREADS=1 ROUNDS=7 ./scripts/bench.sh | tee results/bench-linux-arm64-1t.txt

      - name: Decode benchmark, 4 threads
        run: THREADS=4 ROUNDS=7 ./scripts/bench.sh | tee results/bench-linux-arm64-4t.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-results
          path: results/

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build stock and NEON
        run: ./scripts/build.sh

      - name: Checkasm
        run: |
          mkdir -p results
          RUNS=5 ./scripts/checkasm.sh | tee results/checkasm-macos-arm64.txt

      - name: Decode benchmark, 1 thread
        run: THREADS=1 ROUNDS=7 ./scripts/bench.sh | tee results/bench-macos-arm64-1t.txt

      - name: Decode benchmark, 3 threads
        run: THREADS=3 ROUNDS=7 ./scripts/bench.sh | tee results/bench-macos-arm64-3t.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-results
          path: results/
